<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Weather Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:Arial}#map{height:100vh}.panel{position:absolute;right:20px;top:20px;z-index:999;background:#fff;padding:16px;border-radius:14px;box-shadow:0 8px 24px #0003;width:280px}</style></head><body><div id="map"></div><div class="panel"><h3>Live Weather Map</h3><p>روی هر نقطه کلیک کن.</p><div id="info"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([39,-3],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const cities=[['Madrid',40.4168,-3.7038],['Salamanca',40.9701,-5.6635],['Tehran',35.6892,51.3890],['Ardabil',38.2498,48.2933]];cities.forEach(c=>L.marker([c[1],c[2]]).addTo(map).bindPopup(c[0]));map.on('click',e=>{document.getElementById('info').innerHTML=`Lat: ${e.latlng.lat.toFixed(4)}<br>Lon: ${e.latlng.lng.toFixed(4)}<br><small>برای نسخه کامل، API مختصات را اضافه کن.</small>`})</script></body></html>
