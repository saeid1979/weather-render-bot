<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Weather Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body{margin:0;background:#0f172a;color:#e5e7eb;font-family:Tahoma,Arial,sans-serif} .topbar{padding:14px 18px;display:flex;gap:12px;justify-content:space-between;align-items:center;background:#111827;border-bottom:1px solid #334155} .topbar a,.topbar button{background:#2563eb;color:white;border:0;border-radius:10px;padding:9px 12px;text-decoration:none;cursor:pointer} #map{height:calc(100vh - 66px);width:100%}.legend{position:absolute;bottom:20px;right:20px;z-index:999;background:#111827e8;padding:12px 14px;border-radius:14px;border:1px solid #334155;line-height:2}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-left:7px}.normal{background:#22c55e}.warning{background:#f59e0b}.danger{background:#ef4444}.error{background:#64748b}.popup{direction:rtl;text-align:right;min-width:240px}.popup b{font-size:15px}.popup a{display:inline-block;margin-top:7px;margin-left:5px;background:#2563eb;color:white;padding:6px 8px;border-radius:8px;text-decoration:none}.meta{font-size:12px;color:#94a3b8}
  </style>
</head>
<body>
  <div class="topbar">
    <div><b>🗺 نقشه زنده آب‌وهوا</b> <span id="updated" class="meta"></span></div>
    <div><a href="/">پنل مدیریت</a><button onclick="loadMap()">🔄 بروزرسانی</button></div>
  </div>
  <div id="map"></div>
  <div class="legend">
    <div><span class="dot normal"></span> عادی</div>
    <div><span class="dot warning"></span> هشدار بارندگی/شرایط متوسط</div>
    <div><span class="dot danger"></span> هشدار شدید</div>
    <div><span class="dot error"></span> خطا در دریافت داده</div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/map.js"></script>
</body>
</html>
