<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Bot Admin</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <section id="login" class="card">
      <h1>پنل مدیریت بات هواشناسی</h1>
      <input id="password" type="password" placeholder="ADMIN_PASSWORD" />
      <button onclick="login()">ورود</button>
      <p class="muted">رمز همان ADMIN_PASSWORD در Render است.</p>
    </section>

    <section id="admin" class="hidden">
      <div class="topbar">
        <h1>داشبورد مدیریت</h1>
        <a href="/map" target="_blank">🗺 نقشه زنده</a>
      </div>
      <div class="grid">
        <section class="card">
          <h2>ارسال پیام همگانی</h2>
          <textarea id="broadcastText" placeholder="متن پیام برای همه کاربران فعال"></textarea>
          <button onclick="sendBroadcast()">ارسال همگانی</button>
          <div id="broadcastResult"></div>
        </section>
        <section class="card">
          <h2>افزودن / ویرایش کاربر</h2>
          <input id="u_chatId" placeholder="Chat ID" />
          <input id="u_firstName" placeholder="Name" />
          <input id="u_username" placeholder="Username" />
          <select id="u_language"><option value="fa">fa</option><option value="es">es</option><option value="ar">ar</option></select>
          <select id="u_city"><option value="madrid">madrid</option><option value="salamanca">salamanca</option><option value="tehran">tehran</option><option value="ardabil">ardabil</option></select>
          <input id="u_sendTime" value="08:00" />
          <input id="u_rain" value="50" />
          <label><input type="checkbox" id="u_admin" /> Admin</label>
          <button onclick="saveUser()">ذخیره کاربر</button>
        </section>
      </div>
      <section class="card">
        <h2>کاربران</h2>
        <button onclick="loadUsers()">بروزرسانی کاربران</button>
        <div class="table-wrap"><table id="usersTable"></table></div>
      </section>
      <section class="card">
        <h2>لاگ‌ها</h2>
        <button onclick="loadLogs()">بروزرسانی لاگ‌ها</button>
        <button class="danger" onclick="clearLogs()">پاک کردن لاگ‌ها</button>
        <div class="table-wrap"><table id="logsTable"></table></div>
      </section>
    </section>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
