name: Build JavidDownloader Android v4.2.2
on:
  workflow_dispatch:
  push:
    branches:
      - javid-downloader-android-v4.2.2
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-v4.2.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle assembleDebug
      - name: Verify APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JavidDownloader-Pro-v4.2.2-JAVID-AI-INSTALL
          path: android-v4.2.2/app/build/outputs/apk/debug/app-debug.apk
